name: 每日 AI 情報

on:
  schedule:
    # UTC 20:47 = 台北 04:47。刻意避開整點：
    #   1. 整點是全球最熱門的 cron 時間，GitHub 的排程佇列會延遲更久
    #   2. Anthropic 端同樣是尖峰，實測 UTC 00:00 觸發時策展呼叫收到 529 Overloaded
    #
    # 2026-10-05：從 23:23 提前 2 小時 36 分。原本設台北 07:23 開跑、約 07:50
    # 發布，但 GitHub 的排程佇列從 8/30 起就在遲到，9/29 之後更穩定在
    # +2h20m～+3h20m（近 8 次取樣，平均 +2h50m），實際發布落在台北
    # 10:11～10:52，早就趕不上使用者要的 08:30。
    #
    # 04:47 的算法：最壞 = 佇列 3h20m + 執行 16 分 = 3h36m，04:47 + 3h36m
    # = 08:23，仍在 08:30 之前；典型約 07:47 發布。往後再晚 13 分鐘就不行了
    # （05:00 開跑的最壞情況是 08:36），所以這個時間沒有往後調的空間。
    #
    # 代價：GitHub 若哪天恢復準時，日報會在台北 05:00 前後發布。
    # 這也不是保證——8/27–8/29 曾出現 +3～+7 小時的離群值，那種日子沒有任何
    # cron 設定救得了，由看門狗（台北 09:17/11:17/13:17）接手補跑。
    #
    # 對 arXiv 沒有影響：feed 每天 04:00 UTC 更新，調整前後的實際執行時間
    # （02:0x UTC 次日 → 23:2x UTC 當日）落在同一個 feed 版本區間內。
    - cron: "47 20 * * *"
  workflow_dispatch:        # 也可以手動觸發，用來補跑或測試

permissions:
  contents: write           # 需要把 docs/ 與 state/ 推回 repo

concurrency:
  group: daily-digest
  cancel-in-progress: false # 寧可排隊也不要中斷寫到一半的執行

jobs:
  build:
    runs-on: ubuntu-latest
    # 放寬到 75 分：遇到 529 時每次呼叫最多會退避等待約 7.5 分鐘，
    # 七次呼叫全都撞上的話原本的 45 分鐘會被 timeout 砍掉
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安裝 Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: 信任工作目錄
        # 未信任的目錄會讓 CLI 忽略設定並印出警告。這裡沒有要用 repo 裡的
        # 任何設定（--tools "" 已經關掉所有工具），先標記以免噪音與非預期行為。
        run: |
          mkdir -p ~/.claude
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path.home() / ".claude.json"
          cfg = json.loads(p.read_text()) if p.exists() else {}
          cfg.setdefault("projects", {})[os.getcwd()] = {"hasTrustDialogAccepted": True}
          p.write_text(json.dumps(cfg))
          PY

      - name: 檢查 CLI 與認證
        # 放在收集之前：認證問題三十秒內就爆，不必等收集與補抓跑完四五分鐘
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python preflight.py

      - name: 收集情報
        # 時間窗 48 小時 > 執行間隔 24 小時：某天失敗也不會漏掉新聞。
        # 重複的部分由 state/seen.json 擋掉。
        # --top 45 而策展的 --target 是 30：候選數要大於目標數，策展才有得裁。
        # 兩邊都是 30 的時候，只要擠進機械評分前 30 名幾乎就等於會上稿。
        run: python collect.py --hours 48 --top 45

      - name: 補抓原文全文
        # RSS 多半只給導言。沒有這步，摘要就只能靠模型腦補
        #
        # continue-on-error：這一步的設計本來就是「抓不到就沿用 feed 摘要，
        # 絕不中斷流程」，但那個保證只對 Python 例外有效。2026-10-05 這支程式
        # 被 SIGABRT 帶走（exit 134，libxml2 在原生層 abort），except 攔不到，
        # 整份日報因此沒出。這裡補上流程層的同一個保證。
        #
        # 失敗也不會留下壞資料：candidates.json 是跑到最後才覆寫，中途死掉的話
        # 檔案還是 collect.py 那份完整版；translate.py 與 render.py 讀
        # article_date / text_source 都用 .get() 帶預設值，所以日報照出，
        # 只是摘要退回 feed 導言。
        continue-on-error: true
        run: python extract.py

      - name: 策展與翻譯
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python translate.py --target 30

      - name: 覆蓋率稽核（不阻斷）
        # 抓「feed 還活著但重要內容搬到別的分類」這一類無聲失敗——
        # 日報的「未取得的來源」、verify_feeds.py、新鮮度檢查全都抓不到它，
        # Google 那次就是這樣讓 Gemini 3.5 Transcribe 整則消失的。
        # continue-on-error：這是諮詢性訊號不是門檻，永遠不該擋下當天的日報。
        # 結果寫進 out/，隨執行報告一起上傳為 artifact（保留 14 天）。
        continue-on-error: true
        run: |
          mkdir -p out
          python audit_coverage.py --days 7 | tee out/coverage_audit.txt || true

      - name: 產生網頁
        run: python render.py

      - name: 發布
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          if git diff --staged --quiet; then
            echo "沒有變更，跳過"
          else
            git commit -m "日報 $(TZ=Asia/Taipei date +%Y-%m-%d)"
            git push
          fi

      - name: 保留執行報告
        if: always()        # 失敗時更需要這份報告
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: out/
          retention-days: 14
          if-no-files-found: ignore
