name: 每日 AI 情報

on:
  # 三個時段，不是三次執行：下面的 guard job 會讓「今天已經發過」的那幾次
  # 在幾秒內結束，所以正常情況每天仍然只有一次完整執行。
  #
  # 為什麼要排三次（2026-10-06 定案）：GitHub 的排程佇列延遲既大又不穩定，
  # 單一時段無論設在哪裡都賭不贏。實測的延遲分布：
  #   daily.yml  cron 23:23 UTC → +2h20m～+3h20m（8 次取樣）
  #   daily.yml  cron 20:47 UTC → +4h40m（1 次取樣，10/06）
  #   watchdog   cron 01/03/05:17 UTC → +5h07m～+7h12m（9 次取樣）
  # 也就是 +2.3～+7.2 小時。沒有任何固定提前量能涵蓋這個範圍，
  # 所以改成「多撒幾次、誰先跑到誰出稿、其餘自動跳過」。
  #
  # 落地時間估算（延遲 2.3～4.7 小時 + 執行約 10 分）：
  #   18:07 UTC（台北 02:07）→ 台北 04:37～06:57　✓ 一定在 08:30 前
  #   19:37 UTC（台北 03:37）→ 台北 06:07～08:27　✓ 一定在 08:30 前
  #   21:07 UTC（台北 05:07）→ 台北 07:37～09:57　△ 最壞會超時，當最後的保險
  #
  # 仍然避開整點：整點是全球最熱門的 cron 時間，佇列延遲更久；
  # Anthropic 端同樣是尖峰（實測 UTC 00:00 觸發時策展呼叫收到 529 Overloaded）。
  #
  # 代價：正常情況日報會在台北 05:00～07:00 之間發布，比以前早。
  # 當天 05:00 之後的新聞要等隔天——不會漏，collect.py 的時間窗是 48 小時。
  #
  # 對 arXiv 沒有影響：feed 每天 04:00 UTC 更新，這三個時段的實際執行都落在
  # 同一個 feed 版本區間內，台北週日／週一拿到空 arXiv 的情況不變。
  schedule:
    - cron: "7 18 * * *"
    - cron: "37 19 * * *"
    - cron: "7 21 * * *"
  workflow_dispatch:        # 也可以手動觸發，用來補跑或測試

permissions:
  contents: write           # 需要把 docs/ 與 state/ 推回 repo

concurrency:
  group: daily-digest
  cancel-in-progress: false # 寧可排隊也不要中斷寫到一半的執行

jobs:
  # 今天已經發過就不要再跑。
  #
  # 由來（2026-10-06）：當天手動補跑出稿後，遲到 4.7 小時的排程才開始跑，
  # 而 state/seen.json 這時已經記下第一批 30 則，於是第二次撿了名次 31-60，
  # 產出 30 則完全不重疊的內容，把第一批整個覆寫掉——線上剩下比較弱的那批，
  # 當天還花了兩倍成本。看門狗有這個判斷，daily.yml 自己沒有，這裡補上。
  #
  # 查的是 main 的現況而不是 checkout 的內容：排隊中的那次 checkout 到的是
  # 觸發當下的 SHA，不會有前一次剛推上去的檔案。
  #
  # 只擋排程。手動觸發一律照跑，那是人明確要求的，包括「線上這版壞了要重出」。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 檢查今天是否已經發過
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          from datetime import datetime, timedelta, timezone

          TPE = timezone(timedelta(hours=8))
          today = datetime.now(TPE).strftime("%Y-%m-%d")
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def out(skip, why):
              print(why)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=%s\n" % ("true" if skip else "false"))
              sys.exit(0)

          if os.environ.get("EVENT_NAME") != "schedule":
              out(False, "手動觸發，不做跳過判斷，照跑")

          req = urllib.request.Request(
              "https://api.github.com/repos/%s/contents/docs/%s.html?ref=main" % (repo, today),
              headers={"Authorization": "Bearer %s" % token,
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28"})
          try:
              with urllib.request.urlopen(req) as r:
                  status = r.status
          except urllib.error.HTTPError as e:
              status = e.code

          if status == 200:
              out(True, "docs/%s.html 已存在，今天發過了，跳過這次排程" % today)
          if status == 404:
              out(False, "docs/%s.html 不存在，今天還沒發，開始執行" % today)
          # 查不出來時選擇照跑：沒出日報的代價大於偶爾重跑一次的代價，
          # 而且真的重跑了，推送那步沒有變更就會自己跳過。
          out(False, "查詢得到非預期的 %d，保守起見照跑" % status)
          PY

  build:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 放寬到 75 分：遇到 529 時每次呼叫最多會退避等待約 7.5 分鐘，
    # 七次呼叫全都撞上的話原本的 45 分鐘會被 timeout 砍掉
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安裝 Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: 信任工作目錄
        # 未信任的目錄會讓 CLI 忽略設定並印出警告。這裡沒有要用 repo 裡的
        # 任何設定（--tools "" 已經關掉所有工具），先標記以免噪音與非預期行為。
        run: |
          mkdir -p ~/.claude
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path.home() / ".claude.json"
          cfg = json.loads(p.read_text()) if p.exists() else {}
          cfg.setdefault("projects", {})[os.getcwd()] = {"hasTrustDialogAccepted": True}
          p.write_text(json.dumps(cfg))
          PY

      - name: 檢查 CLI 與認證
        # 放在收集之前：認證問題三十秒內就爆，不必等收集與補抓跑完四五分鐘
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python preflight.py

      - name: 收集情報
        # 時間窗 48 小時 > 執行間隔 24 小時：某天失敗也不會漏掉新聞。
        # 重複的部分由 state/seen.json 擋掉。
        # --top 45 而策展的 --target 是 30：候選數要大於目標數，策展才有得裁。
        # 兩邊都是 30 的時候，只要擠進機械評分前 30 名幾乎就等於會上稿。
        run: python collect.py --hours 48 --top 45

      - name: 補抓原文全文
        # RSS 多半只給導言。沒有這步，摘要就只能靠模型腦補
        #
        # continue-on-error：這一步的設計本來就是「抓不到就沿用 feed 摘要，
        # 絕不中斷流程」，但那個保證只對 Python 例外有效。2026-10-05 這支程式
        # 被 SIGABRT 帶走（exit 134，libxml2 在原生層 abort），except 攔不到，
        # 整份日報因此沒出。這裡補上流程層的同一個保證。
        #
        # 失敗也不會留下壞資料：candidates.json 是跑到最後才覆寫，中途死掉的話
        # 檔案還是 collect.py 那份完整版；translate.py 與 render.py 讀
        # article_date / text_source 都用 .get() 帶預設值，所以日報照出，
        # 只是摘要退回 feed 導言。
        continue-on-error: true
        run: python extract.py

      - name: 策展與翻譯
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python translate.py --target 30

      - name: 覆蓋率稽核（不阻斷）
        # 抓「feed 還活著但重要內容搬到別的分類」這一類無聲失敗——
        # 日報的「未取得的來源」、verify_feeds.py、新鮮度檢查全都抓不到它，
        # Google 那次就是這樣讓 Gemini 3.5 Transcribe 整則消失的。
        # continue-on-error：這是諮詢性訊號不是門檻，永遠不該擋下當天的日報。
        # 結果寫進 out/，隨執行報告一起上傳為 artifact（保留 14 天）。
        continue-on-error: true
        run: |
          mkdir -p out
          python audit_coverage.py --days 7 | tee out/coverage_audit.txt || true

      - name: 產生網頁
        run: python render.py

      - name: 發布
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          if git diff --staged --quiet; then
            echo "沒有變更，跳過"
          else
            git commit -m "日報 $(TZ=Asia/Taipei date +%Y-%m-%d)"
            git push
          fi

      - name: 保留執行報告
        if: always()        # 失敗時更需要這份報告
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: out/
          retention-days: 14
          if-no-files-found: ignore
