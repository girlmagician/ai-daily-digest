<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 情報日報｜收藏</title>
<meta name="description" content="每日自動彙整海外 AI 情報，翻譯成繁體中文並附上原始連結">
<meta property="og:title" content="AI 情報日報｜收藏">
<meta property="og:description" content="每日自動彙整海外 AI 情報，翻譯成繁體中文並附上原始連結">
<meta property="og:type" content="website">
<link rel="alternate" type="application/rss+xml" title="AI 情報日報" href="feed.xml">
<style>
:root{--bg:#fbfbfa;--card:#fff;--fg:#1a1a18;--dim:#6b6b66;--line:#e6e5e0;
--accent:#8a5a2b;--accent-bg:#f3ece3;--hot:#c0442e;--barbg:#fbfbfaf2}
@media(prefers-color-scheme:dark){:root{--bg:#16161a;--card:#1e1e23;--fg:#e8e8e4;
--dim:#9a9a94;--line:#31313a;--accent:#d9a066;--accent-bg:#2a2620;--hot:#e0705a;
--barbg:#16161af2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font-family:-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
line-height:1.75;font-size:16px}
.wrap{max-width:1280px;margin:0 auto;padding:24px 18px 64px}
header{border-bottom:2px solid var(--line);padding-bottom:14px}
h1{font-size:1.6rem;margin:0 0 4px}
h1 a{color:inherit;text-decoration:none}
.sub{color:var(--dim);font-size:.85rem;margin:0}

/* 近 7 日快速切換 */
.days{margin:12px 0 0;font-size:.85rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.days .lbl{color:var(--dim);margin-right:2px}
.days a{color:var(--accent);text-decoration:none;border:1px solid var(--line);
border-radius:6px;padding:2px 9px;font-variant-numeric:tabular-nums}
.days a:hover{background:var(--accent-bg)}
.days .now{background:var(--accent);color:var(--bg);border-color:var(--accent);
padding:2px 9px;border-radius:6px;font-variant-numeric:tabular-nums}
.days .more{border-style:dashed}

/* 分類篩選器：捲動時固定在頂端 */
.groups{position:sticky;top:0;z-index:10;background:var(--barbg);
backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
margin:0 -18px 4px;padding:9px 18px;display:flex;flex-wrap:wrap;gap:7px;
align-items:center;font-size:.85rem}
.groups a{color:var(--fg);text-decoration:none;border:1px solid var(--line);
border-radius:999px;padding:3px 12px;white-space:nowrap}
.groups a:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.groups a b{color:var(--dim);font-weight:400;margin-left:5px;font-size:.78rem}
.groups a:hover b{color:var(--accent)}
.groups .top{margin-left:auto;border-style:dashed;color:var(--dim)}

/* 錨點跳轉時標題不要被固定列遮住 */
h2{font-size:1.05rem;margin:34px 0 4px;padding-top:12px;border-top:1px solid var(--line);
color:var(--accent);letter-spacing:.02em;scroll-margin-top:56px}
/* 兩欄卡片。用 grid 而不是 CSS columns：grid 是先左後右（1,2／3,4），
   閱讀順序與排名一致；columns 會變成整列往下（1,2,3 在左欄），排名就讀不出來了。
   align-items:start 讓卡片保持自然高度，不被同列的長卡片拉長。
   卡片本身就把行寬限制在約 38 個中文字，所以文字不需要再另外設 max-width。 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start;
margin:12px 0}
article{background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:14px 18px;margin:0}
.t{font-size:1.06rem;font-weight:600;margin:0 0 6px;line-height:1.5}
.t a{color:var(--fg);text-decoration:none}
.t a:hover{color:var(--accent);text-decoration:underline}
.n{color:var(--dim);font-variant-numeric:tabular-nums;margin-right:6px;font-weight:400}
.s{margin:6px 0 10px;font-size:.95rem}
.orig{color:var(--dim);font-size:.82rem;margin:6px 0;
overflow-wrap:anywhere;border-left:2px solid var(--line);padding-left:10px}
.meta{font-size:.78rem;color:var(--dim);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{background:var(--accent-bg);color:var(--accent);border-radius:4px;padding:1px 7px;font-size:.72rem}
.hot{color:var(--hot);font-weight:600;text-decoration:none}
.meta a{color:var(--dim)}
.src{color:var(--dim);text-decoration:none;overflow-wrap:anywhere}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);
font-size:.8rem;color:var(--dim)}
footer h3{font-size:.85rem;margin:18px 0 6px;color:var(--fg)}
footer ul{margin:4px 0;padding-left:20px}
.note{background:var(--accent-bg);border-radius:8px;padding:10px 14px;
font-size:.82rem;margin:14px 0;max-width:68em}
ul.arc{list-style:none;padding:0}
ul.arc li{padding:8px 0;border-bottom:1px solid var(--line)}
ul.arc a{color:var(--accent);text-decoration:none;font-weight:600}
/* 視窗不夠寬時收成一欄：兩欄各 450px 以下，卡片會擠得難讀 */
@media(max-width:900px){.grid{grid-template-columns:1fr}}
@media(max-width:640px){
  .groups{margin:0 -14px 4px;padding:8px 14px;gap:5px;font-size:.8rem}
  .wrap{padding:18px 14px 56px}
}
</style>
</head>
<body><div class="wrap"><header><h1><a href="index.html">AI 情報日報</a></h1><p class="sub" id="fav-count">收藏</p><nav class="days"><span class="lbl">近 7 日</span><a href="2026-08-31.html">08/31</a><a href="2026-08-30.html">08/30</a><a href="2026-08-29.html">08/29</a><a href="2026-08-28.html">08/28</a><a href="2026-08-27.html">08/27</a><a href="2026-08-26.html">08/26</a><a href="2026-08-25.html">08/25</a><a class="more" href="archive.html">更早（共 22 天）</a><a class="more fav-link" href="favorites.html">收藏</a><a class="more" href="feed.xml">RSS</a></nav><div class="fav-bar"><button type="button" id="fav-export">匯出 JSON</button><label for="fav-import">匯入</label><input type="file" id="fav-import" accept="application/json,.json"><button type="button" class="danger" id="fav-clear">清除全部</button></div></header><noscript><p class="note">收藏功能需要 JavaScript。這一頁的內容存在你自己的瀏覽器裡（localStorage），必須靠腳本才畫得出來。日報本身不需要 JavaScript，關掉照樣完整可讀。</p></noscript><div id="fav-list"></div><footer><p>收藏只存在這個瀏覽器裡（localStorage），不會上傳到任何地方，也不會經過本站的伺服器。換裝置、換瀏覽器或清除網站資料就會消失——想留著請先用「匯出 JSON」備份。</p><p>收藏記的是原文連結，日報頁面之後即使重新產生也不受影響。</p></footer></div><script id="fav">(function(){
var KEY='ai-digest-favs';
document.head.insertAdjacentHTML('beforeend','<style>'+"\nbutton.fav{float:right;margin:1px 0 4px 10px;border:1px solid var(--line);\nbackground:var(--card);color:var(--dim);cursor:pointer;font-size:15px;line-height:1;\npadding:3px 8px;border-radius:6px;font-family:inherit}\nbutton.fav:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}\nbutton.fav.on{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}\n.fav-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 0}\n.fav-bar button,.fav-bar label{border:1px solid var(--line);background:var(--card);\ncolor:var(--fg);border-radius:6px;padding:3px 12px;cursor:pointer;font-size:.85rem;\nfont-family:inherit;line-height:1.7}\n.fav-bar button:hover,.fav-bar label:hover{border-color:var(--accent);\ncolor:var(--accent);background:var(--accent-bg)}\n.fav-bar input[type=file]{display:none}\n.fav-bar .danger:hover{border-color:var(--hot);color:var(--hot);background:transparent}\n"+'<\/style>');

function load(){try{var v=JSON.parse(localStorage.getItem(KEY));
return (v&&typeof v==='object'&&!Array.isArray(v))?v:{};}catch(e){return {};}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d));return true;}
catch(e){alert('收藏沒有存成功：瀏覽器儲存空間已滿，或這個瀏覽器停用了本機儲存（無痕模式常見）。');
return false;}}
function count(){return Object.keys(load()).length;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function badge(){var n=count(),ls=document.querySelectorAll('a.fav-link');
for(var i=0;i<ls.length;i++){ls[i].textContent=n?'收藏 '+n:'收藏';}}

function metaText(art,re){var ns=art.querySelectorAll('.meta span');
for(var i=0;i<ns.length;i++){var t=ns[i].textContent.trim();if(re.test(t))return t;}
return '';}

function snap(art,a){var src=art.querySelector('.meta .src');
var grid=art.parentElement,h2=grid?grid.previousElementSibling:null;
return {t:a.textContent.trim(),s:src?src.textContent.trim():'',
d:metaText(art,/^[0-9]{2}\/[0-9]{2}/),
g:(h2&&h2.tagName==='H2')?h2.textContent.trim():'',
ts:new Date().toISOString()};}

function decorate(){var arts=document.querySelectorAll('article');
for(var i=0;i<arts.length;i++){(function(art){
var t=art.querySelector('p.t'),a=t?t.querySelector('a'):null;
if(!a||art.querySelector('button.fav'))return;
var url=a.href,b=document.createElement('button');b.type='button';
function paint(){var on=!!load()[url];b.textContent=on?'★':'☆';
b.className='fav'+(on?' on':'');b.title=on?'取消收藏':'收藏';
b.setAttribute('aria-pressed',on?'true':'false');}
b.addEventListener('click',function(){var d=load();
if(d[url]){delete d[url];}else{d[url]=snap(art,a);}
if(save(d)){paint();badge();}});
paint();t.insertBefore(b,t.firstChild);})(arts[i]);}}

function renderList(){var box=document.getElementById('fav-list');if(!box)return;
var d=load(),urls=Object.keys(d),sub=document.getElementById('fav-count');
if(sub){sub.textContent=urls.length?('共 '+urls.length+' 則　依收藏時間由新到舊'):'還沒有收藏';}
if(!urls.length){box.innerHTML='<p class="note">還沒有收藏。到任何一天的日報頁面，'
+'點卡片右上角的 ☆ 就會收進來。<\/p>';return;}
urls.sort(function(x,y){return String(d[y].ts||'').localeCompare(String(d[x].ts||''));});
var groups={},order=[];
for(var i=0;i<urls.length;i++){var g=d[urls[i]].g||'其他';
if(!groups[g]){groups[g]=[];order.push(g);}groups[g].push(urls[i]);}
order.sort(function(x,y){var a=["模型與產品發布", "遊戲與娛樂", "產業與資本", "研究與論文", "工程與工具", "政策與法規", "其他"].indexOf(x),b=["模型與產品發布", "遊戲與娛樂", "產業與資本", "研究與論文", "工程與工具", "政策與法規", "其他"].indexOf(y);
return (a<0?999:a)-(b<0?999:b);});
var h='';
for(var j=0;j<order.length;j++){var g=order[j],list=groups[g];
h+='<h2>'+esc(g)+'<\/h2><div class="grid">';
for(var k=0;k<list.length;k++){var u=list[k],it=d[u];
h+='<article><p class="t"><button type="button" class="fav on" data-url="'+esc(u)
+'" title="移除收藏">★<\/button><a href="'+esc(u)+'" target="_blank" rel="noopener">'
+esc(it.t)+'<\/a><\/p><p class="meta">'
+(it.s?'<span>'+esc(it.s)+'<\/span>':'')
+(it.d?'<span>'+esc(it.d)+'<\/span>':'')
+'<span>收藏於 '+esc(String(it.ts||'').slice(0,10))+'<\/span><\/p><\/article>';}
h+='<\/div>';}
box.innerHTML=h;
var bs=box.querySelectorAll('button.fav');
for(var m=0;m<bs.length;m++){bs[m].addEventListener('click',function(){
var d2=load();delete d2[this.getAttribute('data-url')];
if(save(d2)){renderList();badge();}});}}

function exportFavs(){var blob=new Blob([JSON.stringify(load(),null,2)],
{type:'application/json'}),a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='ai-digest-favs-'+new Date().toISOString().slice(0,10)+'.json';
document.body.appendChild(a);a.click();
setTimeout(function(){URL.revokeObjectURL(a.href);a.parentNode.removeChild(a);},0);}

function importFavs(f){var r=new FileReader();
r.onload=function(){var inc;
try{inc=JSON.parse(r.result);}catch(e){alert('這個檔案不是有效的 JSON。');return;}
if(!inc||typeof inc!=='object'||Array.isArray(inc)){alert('這個檔案不是收藏備份。');return;}
var d=load(),n=0;
for(var k in inc){if(Object.prototype.hasOwnProperty.call(inc,k)&&!d[k]
&&inc[k]&&typeof inc[k]==='object'){d[k]=inc[k];n++;}}
if(save(d)){renderList();badge();alert('匯入完成，新增 '+n+' 筆（重複的保留原本的）。');}};
r.readAsText(f);}

function wire(){var e=document.getElementById('fav-export');
if(e)e.addEventListener('click',exportFavs);
var i=document.getElementById('fav-import');
if(i)i.addEventListener('change',function(){
if(this.files&&this.files[0])importFavs(this.files[0]);this.value='';});
var c=document.getElementById('fav-clear');
if(c)c.addEventListener('click',function(){var n=count();if(!n)return;
if(confirm('確定要清除全部 '+n+' 筆收藏？這個動作沒辦法復原，建議先匯出備份。')){
if(save({})){renderList();badge();}}});}

function init(){decorate();renderList();wire();badge();}
if(document.readyState==='loading'){
document.addEventListener('DOMContentLoaded',init);}else{init();}
})();</script></body>
</html>
